<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Script Sync Configuration</title>
    <link rel="stylesheet" href="../../lib/css/themes/jquery-ui/black/jquery-ui.min.css" />
    <link rel="stylesheet" href="../../css/adapter.css" />
    <script src="../../lib/js/jquery-1.11.1.min.js"></script>
    <script src="../../lib/js/jquery-ui-1.10.3.min.js"></script>
    <script src="../../js/translate.js"></script>
    <script src="../../lib/js/materialize.min.js"></script>
    <link rel="stylesheet" href="../../css/materialize.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="adapter-container">
      <div class="page page-1" style="display: none">
        <div class="row">
          <div class="col s12 m6">
            <img
              src="icon.png"
              class="logo"
            />
          </div>
        </div>

        <div class="row">
          <div class="col s12">
            <ul class="tabs">
              <li class="tab col s3">
                <a href="#tab-main" class="active">Main</a>
              </li>
              <li class="tab col s3">
                <a href="#tab-advanced">Advanced</a>
              </li>
            </ul>
          </div>

          <div id="tab-main" class="col s12">
            <div class="row">
              <div class="col s12">
                <h3 class="translate">GitHub Configuration</h3>
              </div>
            </div>

            <div class="row">
              <div class="col s12 m6">
                <label for="gitHubUrl" class="translate">GitHub Repository URL</label>
                <input
                  type="text"
                  id="gitHubUrl"
                  class="value"
                  placeholder="https://github.com/username/repo"
                />
              </div>
              <div class="col s12 m6">
                <label for="gitHubToken" class="translate">GitHub Personal Access Token</label>
                <input
                  type="password"
                  id="gitHubToken"
                  class="value"
                  placeholder="ghp_..."
                />
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <h3 class="translate">Local Configuration</h3>
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <label for="localScriptPath" class="translate">Local Script Path</label>
                <input
                  type="text"
                  id="localScriptPath"
                  class="value"
                  placeholder="Auto-detected from JavaScript adapter"
                />
                <p class="translate info-text">
                  Leave empty to auto-detect from JavaScript adapter configuration. If empty, default path will be used.
                </p>
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <h3 class="translate">Sync Settings</h3>
              </div>
            </div>

            <div class="row">
              <div class="col s12 m6">
                <label for="syncInterval" class="translate">Sync Interval (seconds)</label>
                <input
                  type="number"
                  id="syncInterval"
                  class="value"
                  min="60"
                  value="300"
                />
              </div>
              <div class="col s12 m6">
                <label for="autoSync" class="translate">Auto Sync</label>
                <input
                  type="checkbox"
                  id="autoSync"
                  class="value"
                />
              </div>
            </div>

            <div class="row">
              <div class="col s12 m6">
                <label for="pullBeforePush" class="translate">Pull Before Push</label>
                <input
                  type="checkbox"
                  id="pullBeforePush"
                  class="value"
                />
              </div>
            </div>
          </div>

          <div id="tab-advanced" class="col s12">
            <div class="row">
              <div class="col s12">
                <h3 class="translate">Advanced File Patterns</h3>
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <label for="includePathPattern" class="translate">Include Path Pattern</label>
                <input
                  type="text"
                  id="includePathPattern"
                  class="value"
                  placeholder="**/*.js"
                />
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <label for="excludePathPattern" class="translate">Exclude Path Pattern</label>
                <input
                  type="text"
                  id="excludePathPattern"
                  class="value"
                  placeholder=""
                />
              </div>
            </div>

            <div class="row">
              <div class="col s12">
                <p class="translate info-text">
                  Use glob patterns for file matching. Examples: **/*.js, test_*.js, **/lib/**/*.js
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="words.js"></script>
    <script src="index_m.js"></script>
  </body>
</html>
